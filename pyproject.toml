[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hkaeshi-mlopsarch_jd101"
version = "0.1.0"
description = "为每一项打分并与阈值比较，明确标出通过、边界与不通过三档"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "hkaeshi" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://hkaeshi.github.io"
Repository = "https://github.com/hkaeshi/mlopsarch_jd101"
Issues = "https://github.com/hkaeshi/mlopsarch_jd101/issues"

[project.scripts]
mlopsarch_jd101 = "mlopsarch_jd101:main"

[tool.setuptools]
py-modules = ["mlopsarch_jd101"]
